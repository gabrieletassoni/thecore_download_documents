# PostgreSQL only: Postgres is the sole DB target of all Thecore gems and host apps, so this
# dummy app never runs on SQLite. When DATABASE_URL is set (e.g. in the devcontainer), its
# server/credentials win but config/boot.rb rewrites its database name to the ones below.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("PGHOST", "db") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: thecore_download_documents_development

test:
  <<: *default
  database: thecore_download_documents_test

production:
  <<: *default
  database: thecore_download_documents_production
